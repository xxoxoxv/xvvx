; إعداد pytest لجذر المستودع
; الهدف: جعل `pytest` من الجذر يجمع الاختبارات بلا خطأ استيراد
; المالك: tools/governance
; تاريخ الإنشاء: 2026-08-16
;
; حقيقة مقيسة: `python -m pytest tests/` كان يعمل، بينما `pytest -q` من الجذر
; يسقط في الجمع بـ ModuleNotFoundError: No module named 'tests.crown'، لأن
; `python -m` يضيف مجلّد العمل إلى sys.path و`pytest` المباشر لا يضيفه، وملفات
; tests/crown تستورد بعضها عبر المسار المطلق `tests.crown.*`. الإعداد أدناه
; يثبّت جذر المستودع في sys.path فيتساوى الأمران.

[pytest]
testpaths = tests
pythonpath = .
