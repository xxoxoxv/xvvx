# AMOS-Federation CI Pipeline
# الهدف: فحص الكود والاختبارات وهوية المستودع
# النطاق: المستودع كامل
# المالك: governance/
# تاريخ الإنشاء: 2026-08-15

name: AMOS-Federation CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federal/executive/services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: federal/executive/services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: pytest tests/ -v --tb=short

  lockfile-check:
    name: Lockfile Consistency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federal/executive/services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          # Verify critical packages are in lock file
          for pkg in fastapi uvicorn sqlalchemy anthropic structlog pydantic; do
            grep -qi "^${pkg}==" requirements.lock || (echo "MISSING: $pkg in requirements.lock" && exit 1)
          done

  identity-check:
    name: Repository Identity (Article 009)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/governance/check_repository_identity.py .

  smoke:
    name: Smoke Tests (12 domains)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repo-wide smoke tests
        run: python tests/smoke/run_smoke_tests.py
