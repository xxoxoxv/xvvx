# حزمة AMOS-Federation المحلية للتطوير
# الهدف: تشغيل كل خدمات النظام محليًا للتطوير
# النطاق: بيئة التطوير المحلية (Docker Compose)
# المالك: federal/executive/services
# تاريخ الإنشاء: 2026-08-15

services:
  postgres:
    image: postgres:16-alpine
    container_name: amos-postgres
    environment:
      POSTGRES_DB: ${AMOS_POSTGRES_DB:-amos_federation}
      POSTGRES_USER: ${AMOS_POSTGRES_USER:-amos}
      POSTGRES_PASSWORD: ${AMOS_POSTGRES_PASSWORD:-dev_password_change_me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amos"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: amos-redis
    command: redis-server --appendonly yes --maxmemory 512mb
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  nats:
    image: nats:2.10-alpine
    container_name: amos-nats
    command: --jetstream --store_dir /data --max_mem_store 256MB --max_file_store 1GB
    ports: ["4222:4222", "8222:8222"]
    volumes: ["nats_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:latest
    container_name: amos-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
  minio:
    image: minio/minio:latest
    container_name: amos-minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${AMOS_MINIO_ACCESS_KEY:-amos}
      MINIO_ROOT_PASSWORD: ${AMOS_MINIO_SECRET_KEY:-dev_password_change_me}
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
  temporal:
    image: temporalio/auto-setup:1.23
    container_name: amos-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_dev
      POSTGRES_SEEDS: temporal-postgres
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports: ["7233:7233"]
  temporal-postgres:
    image: postgres:16-alpine
    container_name: amos-temporal-pg
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_dev
    volumes: ["temporal_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
  grafana:
    image: grafana/grafana:latest
    container_name: amos-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3001:3000"]
    volumes: ["grafana_data:/var/lib/grafana"]
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: amos-jaeger
    environment: ["COLLECTOR_OTLP_ENABLED=true"]
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  api-gateway:
    build: { context: ., args: { SERVICE_NAME: api_gateway, SERVICE_PORT: 8000 } }
    environment: ["AMOS_ENVIRONMENT=${AMOS_ENVIRONMENT:-development}", "AMOS_JWT_SECRET=${AMOS_JWT_SECRET:-dev_secret_change_me}", "AMOS_NATS_URL=${AMOS_NATS_URL:-nats://nats:4222}"]
    ports: ["8000:8000"]
    depends_on: { redis: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 15s, timeout: 5s, retries: 5 }
  orchestrator:
    build: { context: ., args: { SERVICE_NAME: orchestrator, SERVICE_PORT: 8001 } }
    environment: ["AMOS_NATS_URL=${AMOS_NATS_URL:-nats://nats:4222}", "AMOS_POSTGRES_HOST=postgres"]
    ports: ["8001:8001"]
    depends_on: { postgres: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"], interval: 15s, timeout: 5s, retries: 5 }
  agent-runtime:
    build: { context: ., args: { SERVICE_NAME: agent_runtime, SERVICE_PORT: 8002 } }
    ports: ["8002:8002"]
    depends_on: { redis: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"], interval: 15s, timeout: 5s, retries: 5 }
  tool-registry:
    build: { context: ., args: { SERVICE_NAME: tool_registry, SERVICE_PORT: 8003 } }
    ports: ["8003:8003"]
    depends_on: { postgres: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"], interval: 15s, timeout: 5s, retries: 5 }
  model-gateway:
    build: { context: ., args: { SERVICE_NAME: model_gateway, SERVICE_PORT: 8004 } }
    environment: ["AMOS_CLAUDE_API_KEY=${AMOS_CLAUDE_API_KEY:-}"]
    ports: ["8004:8004"]
    depends_on: { redis: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"], interval: 15s, timeout: 5s, retries: 5 }
  memory-service:
    build: { context: ., args: { SERVICE_NAME: memory_service, SERVICE_PORT: 8005 } }
    ports: ["8005:8005"]
    depends_on: { redis: { condition: service_healthy }, nats: { condition: service_healthy }, qdrant: { condition: service_started } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"], interval: 15s, timeout: 5s, retries: 5 }
  evaluation:
    build: { context: ., args: { SERVICE_NAME: evaluation, SERVICE_PORT: 8006 } }
    ports: ["8006:8006"]
    depends_on: { postgres: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"], interval: 15s, timeout: 5s, retries: 5 }
  critic:
    build: { context: ., args: { SERVICE_NAME: critic, SERVICE_PORT: 8007 } }
    ports: ["8007:8007"]
    depends_on: { postgres: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"], interval: 15s, timeout: 5s, retries: 5 }
  governance:
    build: { context: ., args: { SERVICE_NAME: governance, SERVICE_PORT: 8009 } }
    ports: ["8009:8009"]
    depends_on: { postgres: { condition: service_healthy }, nats: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"], interval: 15s, timeout: 5s, retries: 5 }

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  nats_data:
  temporal_pg:
  grafana_data:
